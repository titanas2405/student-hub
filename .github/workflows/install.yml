name: Install

# The installers and the Docker image, tested on real machines (they need the internet and package managers).
on:
  push:
    paths:
      - "install-*"
      - "start-*"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "docker-*"
      - "server.py"
      - ".github/workflows/install.yml"
  workflow_dispatch:

jobs:
  linux-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install-linux.sh --yes
        run: ./install-linux.sh --yes
      - name: Everything it should have installed is there
        run: |
          for program in git gh soffice gs pdfinfo; do command -v "$program"; done
          test -x "$HOME/.local/bin/claude"
          test -x start-linux.sh
          test -f "$HOME/.local/share/applications/student-hub.desktop"
          python3 server.py --check

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install-windows.ps1 parses in Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          powershell -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$PWD\install-windows.ps1', [ref]`$null, [ref]`$e); if (`$e) { `$e; exit 1 }"
          if ($LASTEXITCODE) { exit 1 }
      - name: Run install-windows.ps1 for real in Windows PowerShell 5.1
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install-windows.ps1 -NoSignIn
      - name: Everything it should have installed is there
        shell: pwsh
        run: |
          Get-Content install-log.txt -Tail 40
          py -3 -c "import truststore; print('truststore', truststore.__version__)"
          if (-not (Test-Path "$env:USERPROFILE\.local\bin\claude.exe")) { 'claude.exe missing'; exit 1 }
          if (-not (Test-Path ([Environment]::GetFolderPath('Desktop') + '\Student Hub.lnk'))) { 'desktop shortcut missing'; exit 1 }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            if (-not (Test-Path "$env:ProgramFiles\LibreOffice\program\soffice.exe")) { 'LibreOffice missing although winget exists'; exit 1 }
          } else { 'winget is not on this runner: the winget installs were not exercised' }
          py -3 server.py --check
          if ($LASTEXITCODE) { exit 1 }
      - name: Batch files have Windows line endings
        shell: pwsh
        run: |
          foreach ($f in 'install-windows.bat', 'start-windows.bat', 'install-windows.ps1', 'docker-start.bat', 'docker-signin.bat') {
            $bytes = [IO.File]::ReadAllBytes("$PWD\$f")
            $lf = ($bytes | Where-Object { $_ -eq 10 }).Count; $crlf = 0
            for ($i = 1; $i -lt $bytes.Length; $i++) { if ($bytes[$i] -eq 10 -and $bytes[$i - 1] -eq 13) { $crlf++ } }
            if ($lf -ne $crlf) { "$f has Unix line endings"; exit 1 }
          }

  docker:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for ${{ matrix.platform }}
        run: docker buildx build --platform ${{ matrix.platform }} --load -t student-hub:ci .
      - name: The app starts in the container and finds its tools
        run: |
          docker run -d --name hub --platform ${{ matrix.platform }} -p 127.0.0.1:8765:8765 student-hub:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8765/api/setup | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          ok = {r['name']: r['ok'] for r in d['rows']}
          print(ok)
          assert d['docker'], 'not running as the Docker build'
          for name in ('Python', 'git', 'GitHub CLI', 'LibreOffice', 'Ghostscript', 'Poppler', 'Claude', 'ChatGPT (Codex CLI)', 'Gemini', 'Whisper'):
              assert ok.get(name), name + ' missing in the image'
          "
          docker exec hub /opt/whisper/bin/python -c "import faster_whisper, av, numpy"
          docker exec hub python server.py --check || true
          docker logs hub
