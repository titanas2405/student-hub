name: Install

# Runs the real installers on fresh Windows and Linux machines and checks what they installed.
on:
  push:
    paths:
      - "install.*"
      - "start.*"
      - "server.py"
      - "student_tools.py"
      - "ai_cli.py"
      - ".github/workflows/install.yml"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ./install.sh
        run: ./install.sh
      - name: Everything is installed
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for program in git gh soffice gs pdfinfo claude codex gemini; do command -v "$program"; done
          "$HOME/.local/share/student-hub/whisper/bin/python" -c "import faster_whisper, av, numpy"
          test -f "$HOME/.local/share/applications/student-hub.desktop"
          python3 server.py --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Double-click install.bat
        shell: cmd
        run: install.bat
      - name: Everything is installed
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          & "$env:LOCALAPPDATA\student-hub\whisper\Scripts\python.exe" -c "import faster_whisper, av, numpy"
          if ($LASTEXITCODE) { 'Whisper does not work'; exit 1 }
          py -3 -c "import truststore"
          if ($LASTEXITCODE) { 'truststore missing'; exit 1 }
          $need = @{
            'Claude' = "$env:USERPROFILE\.local\bin\claude.exe"
            'LibreOffice' = "$env:ProgramFiles\LibreOffice\program\soffice.exe"
            'Whisper' = "$env:LOCALAPPDATA\student-hub\whisper\Scripts\python.exe"
            'Start icon' = [Environment]::GetFolderPath('Desktop') + '\Student Hub.lnk'
          }
          foreach ($name in $need.Keys) { if (-not (Test-Path $need[$name])) { "$name missing: $($need[$name])"; exit 1 } }
          $out = py -3 server.py --check | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code) { exit 1 }
          foreach ($name in 'Claude', 'Gemini', 'ChatGPT \(Codex CLI\)', 'git', 'GitHub CLI', 'LibreOffice', 'Poppler', 'Whisper', 'Certificate checks') {
            if ($out -notmatch "\[OK\] $name") { "$name not found by the app"; exit 1 }
          }
      - name: start.bat starts the app
        shell: pwsh
        run: |
          $p = Start-Process cmd -ArgumentList '/c', 'start.bat' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { 'Student Hub is running'; exit 0 } } catch {}
            Start-Sleep 1
          }
          'Student Hub did not start'; exit 1
